<div class="container">
  <h1>Notes</h1>

  <input
    type="text"
    [(ngModel)]="title"
    placeholder="Title"
  />

  <textarea
    [(ngModel)]="text"
    placeholder="Note"
  ></textarea>

  <button (click)="addNote()">Add</button>

  @for (note of notes; track note.id) {
    <div class="note">
      <h2>{{ note.title }}</h2>
      <p>{{ note.text }}</p>

      <button class="delete-button" (click)="deleteNote(note.id)">
        Delete
      </button>
    </div>
  }
</div>
